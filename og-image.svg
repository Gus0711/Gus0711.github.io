<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="rgba(6,182,212,0.1)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(99,102,241,0.1)"/>

  <!-- Lightning bolt icon -->
  <g transform="translate(100, 200)">
    <path d="M60 0 L20 120 L50 120 L40 200 L100 70 L65 70 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- Main text -->
  <text x="220" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f8fafc">G7 Automation</text>

  <!-- Subtitle -->
  <text x="220" y="350" font-family="monospace" font-size="32" fill="#06b6d4">GTB &amp; IoT Project Manager</text>

  <!-- Description -->
  <text x="220" y="420" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">Expert Automatisme • Supervision • LoRaWAN</text>

  <!-- Stats bar -->
  <g transform="translate(220, 480)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="100" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#06b6d4">9+ ans</text>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">Experience</text>

    <rect x="220" y="0" width="200" height="60" rx="8" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="320" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#06b6d4">6000+</text>
    <text x="320" y="50" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">Automates</text>

    <rect x="440" y="0" width="200" height="60" rx="8" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="540" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#06b6d4">5000+</text>
    <text x="540" y="50" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">Devices IoT</text>
  </g>

  <!-- URL -->
  <text x="1180" y="600" text-anchor="end" font-family="monospace" font-size="18" fill="#64748b">gus0711.github.io</text>
</svg>
